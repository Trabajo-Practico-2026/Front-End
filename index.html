<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketUNAJ - Venta de Entradas</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <header
      class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200"
    >
      <div
        class="container mx-auto px-6 py-4 flex justify-between items-center"
      >
        <h1
          class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent"
        >
          TicketUNAJ
        </h1>

        <nav
          class="hidden md:flex space-x-8 font-medium text-slate-600 items-center"
        >
          <a href="index.html" class="hover:text-indigo-600 transition"
            >Eventos</a
          >
          <a
            href="gestion.html"
            class="hover:text-indigo-600 transition text-sm bg-slate-100 px-3 py-1 rounded"
            >Admin</a
          >
        </nav>

        <button
          id="menu-btn"
          class="md:hidden text-slate-600 focus:outline-none p-2"
        >
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7"
            ></path>
          </svg>
        </button>
      </div>

      <div
        id="mobile-menu"
        class="hidden md:hidden bg-white border-t border-slate-100 shadow-lg"
      >
        <nav class="flex flex-col p-4 space-y-4 font-medium text-slate-600">
          <a
            href="index.html"
            class="hover:text-indigo-600 transition py-2 border-b border-slate-50"
            >Eventos</a
          >
          <a
            href="gestion.html"
            class="hover:text-indigo-600 transition py-2 text-indigo-600"
            >Admin</a
          >
        </nav>
      </div>
    </header>

    <section class="bg-slate-900 text-white py-20 px-6">
      <div class="container mx-auto text-center">
        <h2 class="text-4xl md:text-6xl font-extrabold mb-4">
          Vive experiencias inolvidables
        </h2>
        <p class="text-slate-400 text-lg max-w-2xl mx-auto">
          Encuentra entradas para tus eventos preferidos con un solo clic.
        </p>
      </div>
    </section>

    <main class="container mx-auto px-6 py-12">
      <div
        class="flex flex-col md:flex-row justify-between items-center md:items-end mb-8 gap-4"
      >
        <div>
          <h3 class="text-2xl font-bold text-slate-800">Próximos Eventos</h3>
          <p class="text-slate-500">Explora lo que viene pronto</p>
        </div>
        <div class="w-full md:w-auto">
          <input
            type="text"
            placeholder="Buscar evento..."
            class="w-full md:w-80 px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 transition"
          />
        </div>
      </div>

      <div
        id="eventos-container"
        class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"
      >
        <div
          class="animate-pulse bg-white rounded-2xl h-80 shadow-sm border border-slate-200"
        ></div>
        <div
          class="animate-pulse bg-white rounded-2xl h-80 shadow-sm border border-slate-200"
        ></div>
        <div
          class="animate-pulse bg-white rounded-2xl h-80 shadow-sm border border-slate-200"
        ></div>
      </div>
    </main>

    <footer
      class="bg-white border-t border-slate-200 py-8 mt-12 text-center text-slate-500"
    >
      <p>&copy; 2026 TicketUNAJ.</p>
    </footer>

    <script type="module" src="js/ui.js"></script>
    <script type="module" src="js/index.js"></script>
  </body>
</html>
