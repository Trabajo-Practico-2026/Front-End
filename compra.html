<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TicketUNAJ - Seleccion de Asientos</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-50">
    <!-- MODAL LOGIN SIMULADO -->

    <!-- Modal de Bloqueo de Pago -->
    <div
      id="widget-timer"
      class="fixed inset-0 z-[9999] hidden items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4"
    >
      <div
        class="bg-white w-full max-w-md rounded-2xl shadow-2xl p-6 border border-slate-200"
      >
        <div class="text-center">
          <!-- Icono y Título -->
          <div
            class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-indigo-50 mb-4"
          >
            <span
              id="widget-countdown"
              class="text-2xl font-bold text-indigo-600"
              >05:00</span
            >
          </div>
          <h3 class="text-xl font-bold text-slate-800 mb-1">
            ¡Asiento Reservado!
          </h3>
          <p id="widget-asiento" class="text-slate-500 text-sm mb-6">
            Fila X · Asiento Y
          </p>
        </div>

        <div class="space-y-3">
          <!-- Botón Confirmar -->
          <button
            onclick="confirmarPago()"
            id="btn-confirmar-pago"
            class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition flex justify-center items-center gap-2"
          >
            <span
              id="pago-spinner"
              class="hidden animate-spin border-2 border-white/30 border-t-white rounded-full h-4 w-4"
            ></span>
            <span id="pago-texto">💳 Confirmar Pago</span>
          </button>

          <!-- Botón Cancelar -->
          <button
            onclick="cancelarReservaActiva()"
            class="w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-semibold rounded-xl transition"
          >
            Cancelar
        </div>
        <p
          class="text-[10px] text-center text-slate-400 mt-4 uppercase tracking-widest"
        >
          TicketUNAJ - Transacción Segura
        </p>
      </div>
    </div>

    <!-- Header -->
    <header
      class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200"
    >
      <div
        class="container mx-auto px-6 py-4 flex justify-between items-center"
      >
        <h1
          class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent"
        >
          TicketUNAJ
        </h1>
        <div class="flex items-center gap-4">
          <span
            id="header-usuario"
            class="text-sm text-slate-500 hidden"
          ></span>
          <nav
            class="hidden md:flex space-x-8 font-medium text-slate-600 items-center"
          >
            <a href="index.html" class="hover:text-indigo-600 transition"
              >Eventos</a
            >
          </nav>
        </div>

        <button
          id="menu-btn"
          class="md:hidden text-slate-600 focus:outline-none p-2"
        >
          <svg
            class="w-7 h-7"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16m-7 6h7"
            ></path>
          </svg>
        </button>
      </div>

      <div
        id="mobile-menu"
        class="hidden md:hidden bg-white border-t border-slate-100 shadow-lg"
      >
        <nav class="flex flex-col p-4 space-y-4 font-medium text-slate-600">
          <a
            href="index.html"
            class="hover:text-indigo-600 transition py-2 border-b border-slate-50"
            >Eventos</a
          >
        </nav>
      </div>
      
    </header>

    <!-- BREADCRUMB -->
    <div class="container mx-auto px-6 py-4">
      <nav class="text-sm text-slate-500">
        <a href="index.html" class="hover:text-indigo-600 transition"
          >Eventos</a
        >
        <span class="mx-2">/</span>
        <span id="breadcrumb-evento" class="text-slate-800 font-medium"
          >Cargando...</span
        >
      </nav>
    </div>

    <main class="container mx-auto px-6 pb-32">
      <!-- INFO DEL EVENTO -->
      <div id="evento-info" class="mb-8">
        <div
          class="animate-pulse bg-white rounded-2xl h-24 shadow-sm border border-slate-200"
        ></div>
      </div>

      <!-- SECTORES -->
      <div class="mb-8">
        <h3 class="text-lg font-bold text-slate-800 mb-4">
          Seleccioná un sector
        </h3>
        <div id="sectores-container" class="flex flex-wrap gap-3">
          <div
            class="animate-pulse bg-white rounded-xl h-16 w-36 shadow-sm border border-slate-200"
          ></div>
          <div
            class="animate-pulse bg-white rounded-xl h-16 w-36 shadow-sm border border-slate-200"
          ></div>
        </div>
      </div>

      <!-- MAPA DE ASIENTOS -->
      <div id="asientos-section" class="hidden">
        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
          <h3 class="text-lg font-bold text-slate-800">Mapa de Asientos</h3>
          <div class="flex gap-4 text-sm text-slate-500">
            <span class="flex items-center gap-2">
              <span
                class="w-4 h-4 rounded bg-green-100 border border-green-400 inline-block"
              ></span>
              Disponible
            </span>
            <span class="flex items-center gap-2">
              <span
                class="w-4 h-4 rounded bg-red-100 border border-red-300 inline-block"
              ></span>
              Ocupado
            </span>
            <span class="flex items-center gap-2">
              <span class="w-4 h-4 rounded bg-indigo-500 inline-block"></span>
              Seleccionado
            </span>
          </div>
        </div>
        <div class="text-center mb-6">
          <div
            class="inline-block bg-slate-800 text-white text-xs font-bold px-16 py-2 rounded-t-xl tracking-widest"
          >
            ESCENARIO
          </div>
        </div>
        <div
          id="asientos-container"
          class="grid gap-2"
          style="grid-template-columns: repeat(auto-fill, minmax(48px, 1fr))"
        ></div>
      </div>
    </main>

    <!-- PANEL DE RESERVA (fijo abajo) -->
    <div
      id="panel-reserva"
      class="hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg z-50"
    >
      <div
        class="container mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4"
      >
        <div>
          <p class="text-xs text-slate-500 uppercase tracking-wide">
            Asiento seleccionado
          </p>
          <p id="info-asiento" class="text-lg font-bold text-slate-800">—</p>
        </div>
        <div class="flex items-end gap-3">
          <button
            id="btn-cancelar"
            onclick="cancelarSeleccion()"
            class="px-4 py-2 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-100 transition text-sm font-medium"
          >
            Cancelar
          </button>
          <button
            id="btn-reservar"
            onclick="reservarAsiento()"
            class="px-6 py-2 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition flex items-center gap-2"
          >
            <span id="btn-texto">Confirmar Reserva</span>
            <svg
              id="btn-spinner"
              class="hidden animate-spin h-4 w-4 text-white"
              fill="none"
              viewBox="0 0 24 24"
            >
              <circle
                class="opacity-25"
                cx="12"
                cy="12"
                r="10"
                stroke="currentColor"
                stroke-width="4"
              ></circle>
              <path
                class="opacity-75"
                fill="currentColor"
                d="M4 12a8 8 0 018-8v8H4z"
              ></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- TOAST -->
    <div
      id="toast-container"
      class="fixed top-6 right-6 flex flex-col gap-3 z-[100]"
    ></div>
    
    <script type="module" src="js/login.js"></script>
    <script type="module" src="js/compra.js"></script>
    <script type="module" src="js/ui.js"></script>
  </body>
</html>
